name: Inspect Brawler GLB

on:
  push:
    branches:
      - feature/brawler-enhancement-vfx

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect GLB structure
        run: |
          python3 - <<'PY'
          import json, struct
          from pathlib import Path

          path = Path('Brawler_inplace.glb')
          data = path.read_bytes()
          magic, version, length = struct.unpack_from('<4sII', data, 0)
          print(f'FILE={path}')
          print(f'SIZE={len(data)}')
          print(f'MAGIC={magic!r}')
          print(f'GLB_VERSION={version}')
          print(f'GLB_LENGTH={length}')

          pos = 12
          gltf = None
          while pos < len(data):
              chunk_len, chunk_type = struct.unpack_from('<II', data, pos)
              chunk = data[pos+8:pos+8+chunk_len]
              pos += 8 + chunk_len
              if chunk_type == 0x4E4F534A:
                  gltf = json.loads(chunk.decode('utf-8'))
                  break

          if gltf is None:
              raise SystemExit('No JSON chunk found')

          def names(items):
              return [(i, x.get('name')) for i, x in enumerate(items or [])]

          print('\nNODES')
          for i, node in enumerate(gltf.get('nodes', [])):
              print(f'NODE {i}: name={node.get("name")!r} mesh={node.get("mesh")} skin={node.get("skin")} children={node.get("children", [])}')

          print('\nMESHES')
          for i, mesh in enumerate(gltf.get('meshes', [])):
              print(f'MESH {i}: name={mesh.get("name")!r} primitives={len(mesh.get("primitives", []))}')

          print('\nSKINS')
          for i, skin in enumerate(gltf.get('skins', [])):
              print(f'SKIN {i}: name={skin.get("name")!r} skeleton={skin.get("skeleton")} joints={skin.get("joints", [])}')

          print('\nMATERIALS')
          for i, mat in enumerate(gltf.get('materials', [])):
              pbr = mat.get('pbrMetallicRoughness', {})
              print(f'MATERIAL {i}: name={mat.get("name")!r} alphaMode={mat.get("alphaMode")} emissive={mat.get("emissiveFactor")} baseColor={pbr.get("baseColorFactor")}')

          print('\nANIMATIONS')
          for i, anim in enumerate(gltf.get('animations', [])):
              print(f'ANIMATION {i}: name={anim.get("name")!r} channels={len(anim.get("channels", []))} samplers={len(anim.get("samplers", []))}')

          print('\nSCENES')
          for i, scene in enumerate(gltf.get('scenes', [])):
              print(f'SCENE {i}: name={scene.get("name")!r} nodes={scene.get("nodes", [])}')
          PY
