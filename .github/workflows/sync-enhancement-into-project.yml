name: Sync Enhancement Into GDevelop Project

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - feature/brawler-boxer-attacks

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.event.pull_request.head.ref == 'feature/brawler-enhancement-vfx' && !startsWith(github.event.pull_request.title, '[generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Inject enhancement modules into GDevelop project
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          project_path = Path('Havoc Online.json')
          project = json.loads(project_path.read_text(encoding='utf-8'))
          config_lines = Path('scripts/enhancement/config.js').read_text(encoding='utf-8').splitlines()
          vfx_lines = Path('scripts/enhancement/vfx.js').read_text(encoding='utf-8').splitlines()
          code = project['layouts'][0]['events'][0]['inlineCode']

          marker = '// --- Brawler runtime entry point ---'
          config_marker = '// --- scripts/enhancement/config.js ---'
          vfx_marker = '// --- scripts/enhancement/vfx.js ---'
          entry_call = 'updateBrawlerCombat(runtimeScene, brawlerDt);'
          enhancement_call = 'updateHavocEnhancement(runtimeScene, brawlerDt);'

          # Remove the earlier prototype injection if this branch already contains it.
          cleaned = []
          for line in code:
              if config_marker in line and vfx_marker in line:
                  continue
              if entry_call in line and enhancement_call in line:
                  line = entry_call
              cleaned.append(line)
          code = cleaned

          marker_index = next((i for i, line in enumerate(code) if marker in line), None)
          if marker_index is None:
              raise SystemExit('Brawler runtime marker not found')

          entry_index = next((i for i, line in enumerate(code) if line.strip() == entry_call), None)
          if entry_index is None:
              raise SystemExit('Brawler runtime entry call not found')

          injected_lines = (
              [config_marker] +
              config_lines +
              ['', vfx_marker] +
              vfx_lines +
              ['']
          )
          code[marker_index:marker_index] = injected_lines
          entry_index += len(injected_lines)

          if not any(line.strip() == enhancement_call for line in code):
              code.insert(entry_index + 1, enhancement_call)

          project['layouts'][0]['events'][0]['inlineCode'] = code
          project_path.write_text(json.dumps(project, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('Enhancement modules injected as real GDevelop inlineCode lines.')
          PY

      - name: Validate generated project code
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          project = json.loads(Path('Havoc Online.json').read_text(encoding='utf-8'))
          code = project['layouts'][0]['events'][0]['inlineCode']
          required = {
              '// --- scripts/enhancement/config.js ---',
              '// --- scripts/enhancement/vfx.js ---',
              'function updateHavocEnhancement(runtimeScene, dt) {',
              'updateHavocEnhancement(runtimeScene, brawlerDt);',
          }
          missing = sorted(item for item in required if item not in code)
          if missing:
              raise SystemExit('Missing generated code: ' + ', '.join(missing))
          if any('\\n' in line and ('HAVOC_ENHANCEMENT' in line or 'updateHavocEnhancement' in line) for line in code):
              raise SystemExit('Generated enhancement code contains literal backslash-n sequences')
          print('Generated project validation passed.')
          PY

      - name: Commit generated project update and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/sync-enhancement-into-project.yml
          git add 'Havoc Online.json' scripts/enhancement/config.js scripts/enhancement/vfx.js
          git commit -m 'build: sync enhancement into GDevelop project'
          git push origin HEAD:${{ github.head_ref }}
