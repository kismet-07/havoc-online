name: Sync Enhancement Into GDevelop Project

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - feature/brawler-boxer-attacks

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.event.pull_request.head.ref == 'feature/brawler-enhancement-vfx' && !startsWith(github.event.pull_request.title, '[generated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Inspect GDevelop JavaScript event
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          project = json.loads(Path('Havoc Online.json').read_text(encoding='utf-8'))
          code = project['layouts'][0]['events'][0]['inlineCode']
          print('INLINE_CODE_COUNT=', len(code))
          for i in range(max(0, len(code)-30), len(code)):
              print(f'CODE[{i}]=', repr(code[i]))
          print('ENTRY_MATCHES=')
          for i, line in enumerate(code):
              if 'updateBrawlerCombat' in line or 'brawlerDt' in line:
                  print(i, repr(line))
          PY

      - name: Inject enhancement modules into GDevelop project
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          project_path = Path('Havoc Online.json')
          project = json.loads(project_path.read_text(encoding='utf-8'))
          config = Path('scripts/enhancement/config.js').read_text(encoding='utf-8').strip()
          vfx = Path('scripts/enhancement/vfx.js').read_text(encoding='utf-8').strip()
          code = project['layouts'][0]['events'][0]['inlineCode']

          marker = '// --- Brawler runtime entry point ---'
          entry_call = 'updateBrawlerCombat(runtimeScene, brawlerDt);'
          enhancement_call = 'updateHavocEnhancement(runtimeScene, brawlerDt);'

          marker_index = next((i for i, line in enumerate(code) if marker in line), None)
          if marker_index is None:
              raise SystemExit('Brawler runtime marker not found')

          entry_index = next((i for i, line in enumerate(code) if entry_call in line), None)
          if entry_index is None:
              raise SystemExit('Brawler runtime entry call not found')

          if not any('// --- scripts/enhancement/config.js ---' in line for line in code):
              enhancement_source = (
                  '// --- scripts/enhancement/config.js ---\\n' + config +
                  '\\n\\n// --- scripts/enhancement/vfx.js ---\\n' + vfx
              )
              code.insert(marker_index, enhancement_source)
              if entry_index >= marker_index:
                  entry_index += 1

          if not any(enhancement_call in line for line in code):
              code[entry_index] = code[entry_index] + '\\n' + enhancement_call

          project['layouts'][0]['events'][0]['inlineCode'] = code
          project_path.write_text(json.dumps(project, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('Enhancement code injected into inlineCode.')
          PY

      - name: Commit generated project update and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/sync-enhancement-into-project.yml
          git add 'Havoc Online.json' scripts/enhancement/config.js scripts/enhancement/vfx.js
          git commit -m 'build: sync enhancement into GDevelop project'
          git push origin HEAD:${{ github.head_ref }}
