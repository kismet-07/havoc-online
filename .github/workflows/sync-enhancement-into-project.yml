name: Sync Enhancement Into GDevelop Project

on:
  pull_request:
    types: [opened]
    branches:
      - feature/brawler-boxer-attacks

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.event.pull_request.head.ref == 'feature/brawler-enhancement-vfx-clean' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1

      - name: Inject enhancement modules
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          project_path = Path('Havoc Online.json')
          project = json.loads(project_path.read_text(encoding='utf-8'))
          config_lines = Path('scripts/enhancement/config.js').read_text(encoding='utf-8').splitlines()
          vfx_lines = Path('scripts/enhancement/vfx.js').read_text(encoding='utf-8').splitlines()
          code = project['layouts'][0]['events'][0]['inlineCode']

          marker = '// --- Brawler runtime entry point ---'
          entry_call = 'updateBrawlerCombat(runtimeScene, brawlerDt);'
          enhancement_call = 'updateHavocEnhancement(runtimeScene, brawlerDt);'

          marker_index = next(i for i, line in enumerate(code) if marker in line)
          entry_index = next(i for i, line in enumerate(code) if line.strip() == entry_call)

          injected = [
              '// --- scripts/enhancement/config.js ---',
              *config_lines,
              '',
              '// --- scripts/enhancement/vfx.js ---',
              *vfx_lines,
              '',
          ]
          code[marker_index:marker_index] = injected
          entry_index += len(injected)
          code.insert(entry_index + 1, enhancement_call)

          project['layouts'][0]['events'][0]['inlineCode'] = code
          project_path.write_text(json.dumps(project, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate project
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          project = json.loads(Path('Havoc Online.json').read_text(encoding='utf-8'))
          code = project['layouts'][0]['events'][0]['inlineCode']
          required = [
              '// --- scripts/enhancement/config.js ---',
              '// --- scripts/enhancement/vfx.js ---',
              'function updateHavocEnhancement(runtimeScene, dt) {',
              'updateHavocEnhancement(runtimeScene, brawlerDt);',
          ]
          assert all(item in code for item in required), 'Enhancement injection validation failed'
          assert not any('\\n' in line for line in code if 'HAVOC_ENHANCEMENT' in line or 'updateHavocEnhancement' in line), 'Literal newline escape detected'
          print('Enhancement injection validation passed.')
          PY

      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/sync-enhancement-into-project.yml
          git add 'Havoc Online.json' scripts/enhancement/config.js scripts/enhancement/vfx.js
          git commit -m 'build: sync enhancement into GDevelop project'
          git push origin HEAD:${{ github.head_ref }}
