name: Repair GDevelop Login Project

on:
  push:
    branches:
      - feature/havoc-login-ui

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'Repair GDevelop login project structure') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and repair GDevelop object folder structures
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('Havoc Online.json')
          data = json.loads(path.read_text(encoding='utf-8'))

          for layout in data.get('layouts', []):
              valid = {obj.get('name') for obj in layout.get('objects', []) if obj.get('name')}
              layout['objectsFolderStructure'] = {
                  'folderName': '__ROOT',
                  'children': [{'objectName': name} for name in sorted(valid)]
              }

          json.dumps(data, ensure_ascii=False, indent=2)
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          json.loads(path.read_text(encoding='utf-8'))
          print('GDevelop project JSON is valid.')
          PY

      - name: Commit repaired project
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Havoc Online.json'
          if git diff --cached --quiet; then
            echo 'No repair changes required.'
            exit 0
          fi
          git commit -m 'Repair GDevelop login project structure'
          git push
