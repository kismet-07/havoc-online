name: Repair GDevelop Login Project

on:
  workflow_dispatch:
  push:
    branches:
      - feature/havoc-login-ui

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and repair GDevelop project structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('Havoc Online.json')
          raw = path.read_text(encoding='utf-8')

          decoder = json.JSONDecoder()
          start = len(raw) - len(raw.lstrip())
          data, end = decoder.raw_decode(raw, start)
          trailing = raw[end:].strip()

          if trailing:
              print(f'Warning: removing {len(trailing)} trailing characters after the first JSON document.')

          if not isinstance(data, dict):
              raise RuntimeError('GDevelop project root is not a JSON object.')

          layouts = data.get('layouts', [])
          if not layouts:
              raise RuntimeError('No GDevelop layouts found.')

          for layout in layouts:
              objects = layout.get('objects', [])
              valid_names = [obj.get('name') for obj in objects if obj.get('name')]
              valid = set(valid_names)

              for instance in layout.get('instances', []):
                  name = instance.get('name')
                  if name and name not in valid:
                      raise RuntimeError(
                          f"Layout '{layout.get('name')}' has instance '{name}' without a matching object definition."
                      )

              layout['objectsFolderStructure'] = {
                  'folderName': '__ROOT',
                  'children': [{'objectName': name} for name in valid_names]
              }

          login = next((layout for layout in layouts if layout.get('name') == 'Login'), None)
          if login is None:
              raise RuntimeError('Login layout is missing.')

          data['firstLayout'] = login.get('mangledName') or login.get('name')

          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          json.loads(path.read_text(encoding='utf-8'))
          print('GDevelop project JSON validated and repaired successfully.')
          print('Startup layout:', data['firstLayout'])
          for layout in layouts:
              print(layout.get('name'), 'objects:', len(layout.get('objects', [])))
          PY

      - name: Commit repaired project
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Havoc Online.json'
          if git diff --cached --quiet; then
            echo 'No repair changes required.'
            exit 0
          fi
          git commit -m 'Repair GDevelop login project JSON'
          git push
